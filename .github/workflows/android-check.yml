# Builds the Android app and runs its lint and unit tests on pull requests that change it.
name: Check the Android app
on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-*.yml'
permissions:
  contents: read
concurrency:
  group: android-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and check
        run: ./gradlew assembleDebug check
      - name: Upload the lint report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-*.html
          if-no-files-found: ignore
